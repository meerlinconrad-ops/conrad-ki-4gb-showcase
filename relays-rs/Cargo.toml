[package]
name = "conrad-relays"
version = "0.1.0"
edition = "2021"
authors = ["Merlin Conrad <merlin@conrad-ki.com>"]
description = "Ultra-lean async Rust HTTP/Webhook/SMTP relays replacing Python 3 relay daemons on Hetzner 4-GB showcase."

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1.0"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 2
panic = "abort"
strip = true
